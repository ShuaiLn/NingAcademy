name: P-1 database audit

on:
  pull_request:
    paths:
      - ".github/workflows/p1-database-audit.yml"
      - "docs/p1/**"
      - "scripts/p1/**"
      - "supabase/config.toml"
      - "supabase/drafts/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/database.types.ts"
      - "package.json"
      - "package-lock.json"
      - "app/actions/personal-words.ts"
      - "app/student/personal-english/**"
      - "app/student/student-nav.tsx"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p1-database-audit.yml"
      - "docs/p1/**"
      - "scripts/p1/**"
      - "supabase/config.toml"
      - "supabase/drafts/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/database.types.ts"
      - "package.json"
      - "package-lock.json"
      - "app/actions/personal-words.ts"
      - "app/student/personal-english/**"
      - "app/student/student-nav.tsx"
  workflow_dispatch:
    inputs:
      run_production_audit:
        description: "Run the read-only Production export and comparisons"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: p1-database-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.114.0

jobs:
  replay:
    name: Replay every migration from zero
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      baseline_status: ${{ steps.replay.outputs.baseline_status }}
      replay_status: ${{ steps.replay.outputs.replay_status }}
      games_retirement_status: ${{ steps.runtime_privileges.outputs.status }}
      authorization_test_status: ${{ steps.authorization_tests.outputs.status }}
      personal_english_test_status: ${{ steps.personal_english_tests.outputs.status }}
      type_generation_status: ${{ steps.type_generation.outputs.status }}
      type_drift_status: ${{ steps.type_drift.outputs.status }}
      snapshot_status: ${{ steps.replay_snapshot.outputs.status }}
      history_status: ${{ steps.replay_history.outputs.status }}
      convergence_status: ${{ steps.convergence.outputs.status }}
      prefix_status: ${{ steps.replay_prefix.outputs.status }}
      prefix_snapshot_status: ${{ steps.replay_prefix_snapshot.outputs.status }}
      prefix_history_status: ${{ steps.replay_prefix_history.outputs.status }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Supabase CLI
        # supabase/setup-cli v3.0.0; pin the action and CLI for reproducible service images.
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify the committed Git migration inventory
        run: node scripts/p1/generate-git-migrations.mjs --check docs/p1/git_migrations.csv

      - name: Verify the retired Games migration evidence
        run: node scripts/p1/audit-game-listening-migrations.mjs

      - name: Start an empty local Supabase and replay from zero
        id: replay
        shell: bash
        run: |
          # GitHub's bash wrapper starts with -e. This step deliberately records
          # the failing command's status so later evidence/export steps still run.
          set +e
          set -uo pipefail
          mkdir -p p1-artifacts/replay

          saved_migrations="$RUNNER_TEMP/p1-project-migrations"
          saved_seed="$RUNNER_TEMP/p1-project-seed.sql"
          seed_existed=0

          mv supabase/migrations "$saved_migrations"
          mkdir supabase/migrations
          if [[ -e supabase/seed.sql ]]; then
            mv supabase/seed.sql "$saved_seed"
            seed_existed=1
          fi
          : > supabase/seed.sql

          supabase start 2>&1 | tee p1-artifacts/replay/baseline-start.log
          baseline_status=${PIPESTATUS[0]}

          mv supabase/seed.sql "$RUNNER_TEMP/p1-empty-seed-after-start.sql"
          mv supabase/migrations "$RUNNER_TEMP/p1-empty-migrations-after-start"
          mv "$saved_migrations" supabase/migrations
          if [[ "$seed_existed" == "1" ]]; then
            mv "$saved_seed" supabase/seed.sql
          fi

          if [[ "$baseline_status" != "0" ]]; then
            printf 'Baseline Supabase startup failed with exit code %s; migration replay did not start.\n' \
              "$baseline_status" | tee p1-artifacts/replay/replay.log
            replay_status=125
          else
            bash scripts/p1/replay-local-with-games-retirement.sh \
              2>&1 | tee p1-artifacts/replay/replay.log
            replay_status=${PIPESTATUS[0]}
          fi

          printf '%s\n' "$baseline_status" > p1-artifacts/replay/baseline_status.txt
          printf '%s\n' "$replay_status" > p1-artifacts/replay/replay_status.txt
          echo "baseline_status=$baseline_status" >> "$GITHUB_OUTPUT"
          echo "replay_status=$replay_status" >> "$GITHUB_OUTPUT"

      - name: Assert the post-replay Games retirement catalog
        id: runtime_privileges
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p p1-artifacts/replay
          if [[ "${{ steps.replay.outputs.replay_status }}" != "0" ]]; then
            printf 'SKIPPED: full replay did not complete.\n' \
              | tee p1-artifacts/replay/games-retirement.log
            privilege_status=125
          else
            db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"
            if [[ -z "$db_container" ]]; then
              printf 'No running Supabase database container was found.\n' \
                | tee p1-artifacts/replay/games-retirement.log
              privilege_status=125
            else
              docker exec --interactive "$db_container" psql \
                --username postgres --dbname postgres --no-psqlrc \
                < scripts/p1/assert-games-retired.sql \
                2>&1 | tee p1-artifacts/replay/games-retirement.log
              privilege_status=${PIPESTATUS[0]}
            fi
          fi
          printf '%s\n' "$privilege_status" \
            > p1-artifacts/replay/games_retirement_status.txt
          echo "status=$privilege_status" >> "$GITHUB_OUTPUT"

      - name: Run authorization pgTAP suite against the full replay
        id: authorization_tests
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p p1-artifacts/replay
          if [[ "${{ steps.replay.outputs.replay_status }}" != "0" || "${{ steps.runtime_privileges.outputs.status }}" != "0" ]]; then
            printf 'SKIPPED: full replay or post-retirement assertion did not pass.\n' \
              | tee p1-artifacts/replay/authorization-pgtap.log
            test_status=125
          else
            supabase test db --local supabase/tests/authorization.test.sql \
              2>&1 | tee p1-artifacts/replay/authorization-pgtap.log
            test_status=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$test_status" \
            > p1-artifacts/replay/authorization_pgtap_status.txt
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Personal English pgTAP suite against the full replay
        id: personal_english_tests
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p p1-artifacts/replay
          if [[ "${{ steps.replay.outputs.replay_status }}" != "0" || "${{ steps.runtime_privileges.outputs.status }}" != "0" ]]; then
            printf 'SKIPPED: full replay or post-retirement assertion did not pass.\n' \
              | tee p1-artifacts/replay/personal-english-pgtap.log
            test_status=125
          else
            supabase test db --local supabase/tests/personal_english.test.sql \
              2>&1 | tee p1-artifacts/replay/personal-english-pgtap.log
            test_status=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$test_status" \
            > p1-artifacts/replay/personal_english_pgtap_status.txt
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate public-schema TypeScript types from the full replay
        id: type_generation
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p p1-artifacts/replay
          generated_types=p1-artifacts/replay/generated.database.types.ts
          if [[ "${{ steps.replay.outputs.replay_status }}" != "0" || "${{ steps.runtime_privileges.outputs.status }}" != "0" ]]; then
            printf 'SKIPPED: full replay or post-retirement assertion did not pass.\n' \
              | tee p1-artifacts/replay/type-generation.log
            : > "$generated_types"
            generation_status=125
          else
            supabase gen types typescript --local --schema public \
              > "$generated_types" \
              2> p1-artifacts/replay/type-generation.log
            generation_status=$?
          fi
          printf '%s\n' "$generation_status" \
            > p1-artifacts/replay/type_generation_status.txt
          echo "status=$generation_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compare generated and committed database types
        id: type_drift
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p p1-artifacts/replay
          generated_types=p1-artifacts/replay/generated.database.types.ts
          generated_normalized=p1-artifacts/replay/generated.database.types.normalized.ts
          committed_normalized=p1-artifacts/replay/committed.database.types.normalized.ts

          if [[ "${{ steps.type_generation.outputs.status }}" != "0" || ! -s "$generated_types" ]]; then
            printf 'Type comparison unavailable: generation failed or produced an empty artifact.\n' \
              > p1-artifacts/replay/database-types.diff
            type_status=125
          else
            sed 's/\r$//' "$generated_types" > "$generated_normalized"
            sed 's/\r$//' supabase/database.types.ts > "$committed_normalized"
            diff -u \
              --label committed/supabase/database.types.ts \
              --label replay/generated.database.types.ts \
              "$committed_normalized" \
              "$generated_normalized" \
              > p1-artifacts/replay/database-types.diff
            type_status=$?
          fi

          printf '%s\n' "$type_status" \
            > p1-artifacts/replay/type_drift_status.txt
          echo "status=$type_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export replay schema and migration history
        id: replay_snapshot
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          snapshot_status=0
          mkdir -p p1-artifacts/replay

          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"
          if [[ -z "$db_container" ]]; then
            printf 'No running Supabase database container was found.\n' \
              | tee p1-artifacts/replay/snapshot-error.log
            : > p1-artifacts/replay/replay_schema.sql
            : > p1-artifacts/replay/replay_project_schema.sql
            : > p1-artifacts/replay/replay_db_migrations.csv
            snapshot_status=1
          else
            docker exec "$db_container" pg_dump \
              --username postgres --dbname postgres \
              --schema-only --no-owner --no-privileges \
              > p1-artifacts/replay/replay_schema.sql || snapshot_status=$?

            mapfile -t project_schemas < <(
              docker exec "$db_container" psql --username postgres --dbname postgres \
                --no-psqlrc --tuples-only --no-align \
                --command "select nspname from pg_namespace where nspname in ('public','private','game','game_private') order by nspname"
            )
            schema_args=()
            for schema in "${project_schemas[@]}"; do
              [[ -n "$schema" ]] && schema_args+=("--schema=$schema")
            done
            if [[ "${#schema_args[@]}" == "0" ]]; then
              printf 'No project schema exists in the replay database.\n' \
                | tee -a p1-artifacts/replay/snapshot-error.log
              : > p1-artifacts/replay/replay_project_schema.sql
              snapshot_status=1
            else
              docker exec "$db_container" pg_dump \
                --username postgres --dbname postgres \
                --schema-only --no-owner --no-privileges \
                "${schema_args[@]}" \
                > p1-artifacts/replay/replay_project_schema.sql || snapshot_status=$?
              docker exec "$db_container" pg_dump \
                --username postgres --dbname postgres \
                --schema-only --no-owner \
                "${schema_args[@]}" \
                > p1-artifacts/replay/replay_project_schema_with_acl.sql || snapshot_status=$?
            fi

            history_has_name="$(
              docker exec "$db_container" psql --username postgres --dbname postgres \
                --no-psqlrc --tuples-only --no-align \
                --command "select exists (select 1 from information_schema.columns where table_schema = 'supabase_migrations' and table_name = 'schema_migrations' and column_name = 'name')"
            )"
            if [[ "$history_has_name" == "t" ]]; then
              history_name_expression="coalesce(name, '')::text"
            else
              history_name_expression="''::text"
            fi
            docker exec "$db_container" psql --username postgres --dbname postgres \
              --no-psqlrc --set ON_ERROR_STOP=1 \
              --command "copy (select row_number() over (order by version)::integer as execution_order, version::text as version, $history_name_expression as name from supabase_migrations.schema_migrations order by version) to stdout with (format csv, header true)" \
              > p1-artifacts/replay/replay_db_migrations.csv || snapshot_status=$?
          fi

          printf '%s\n' "$snapshot_status" > p1-artifacts/replay/snapshot_status.txt
          echo "status=$snapshot_status" >> "$GITHUB_OUTPUT"

      - name: Compare Git and replay migration histories
        id: replay_history
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/p1/compare-migration-history.mjs \
            docs/p1/git_migrations.csv \
            p1-artifacts/replay/replay_db_migrations.csv \
            replay \
            > p1-artifacts/replay/git-vs-replay-migrations.md 2>&1
          comparison_status=$?
          printf '%s\n' "$comparison_status" > p1-artifacts/replay/history_comparison_status.txt
          echo "status=$comparison_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify convergence migrations against final and partial states
        id: convergence
        if: always()
        shell: bash
        run: |
          set +e
          convergence_status=0
          mkdir -p p1-artifacts/replay
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"

          if [[ -z "$db_container" ]]; then
            echo "No running Supabase database container was found." \
              > p1-artifacts/replay/convergence.log
            convergence_status=1
          else
            (
              set -euo pipefail

              apply_convergence_migrations() {
                for migration in \
                  supabase/migrations/20260815120000_core_auth_phase1_catchup_rls_and_grants.sql \
                  supabase/migrations/20260815130000_finalize_student_creation_return_status.sql \
                  supabase/migrations/20260815140000_core_auth_identity_fk_delete_restrict.sql \
                  supabase/migrations/20260815150000_complete_password_change_convergence.sql
                do
                  echo "Applying convergence check: $migration"
                  docker exec -i "$db_container" psql \
                    --username postgres --dbname postgres --no-psqlrc \
                    --set ON_ERROR_STOP=1 --single-transaction < "$migration"
                done
              }

              echo "Reapplying all convergence migrations twice to the already-final replay schema."
              docker exec "$db_container" psql \
                --username postgres --dbname postgres --no-psqlrc \
                --set ON_ERROR_STOP=1 --csv \
                --command "select routine.oid, pg_catalog.pg_get_userbyid(routine.proowner) as owner, language.lanname as language, routine.prorettype::pg_catalog.regtype::text as return_type, routine.prosecdef, routine.proleakproof, routine.proisstrict, routine.provolatile, routine.proparallel, routine.procost, routine.prorows, routine.proconfig, routine.proacl from pg_catalog.pg_proc as routine join pg_catalog.pg_language as language on language.oid = routine.prolang where routine.oid = pg_catalog.to_regprocedure('public.complete_password_change(uuid)')" \
                > p1-artifacts/replay/complete-password-change-metadata.before.csv
              apply_convergence_migrations
              apply_convergence_migrations

              echo "Creating a mixed partial state in the isolated CI database."
              docker exec -i "$db_container" psql \
                --username postgres --dbname postgres --no-psqlrc \
                --set ON_ERROR_STOP=1 --single-transaction <<'SQL'
          drop policy if exists "profiles_select_self_or_own_students" on public.profiles;
          create policy "profiles_select_self" on public.profiles
            for select to authenticated using (id = (select auth.uid()));

          drop policy if exists "students_select_self_or_own_teacher" on public.students;
          create policy "students_select_self" on public.students
            for select to authenticated using (id = (select auth.uid()));

          alter table public.profiles
            drop constraint if exists profiles_id_fkey;
          alter table public.profiles
            add constraint profiles_id_fkey
            foreign key (id) references auth.users (id) on delete cascade;

          alter table public.teachers
            drop constraint if exists teachers_id_fkey;
          alter table public.teachers
            add constraint teachers_id_fkey
            foreign key (id) references public.profiles (id) on delete cascade;

          create or replace function public.complete_password_change(p_request_id uuid)
          returns void
          language plpgsql
          security definer
          set search_path = ''
          as $partial$
          declare
            v_uid uuid := (select auth.uid());
            v_role text;
          begin
            if v_uid is null then
              raise exception 'not authenticated' using errcode = '28000';
            end if;

            select role into v_role from public.profiles where id = v_uid;

            update public.profiles
            set must_change_password = false
            where id = v_uid;

            insert into public.audit_log
              (actor_user_id, actor_type, action, target_table, target_id, request_id, outcome, detail)
            values
              (v_uid, coalesce(v_role, 'system'), 'change_password', 'profiles', v_uid, p_request_id, 'succeeded', '{}'::jsonb);
          exception
            when others then
              insert into public.audit_log
                (actor_user_id, actor_type, action, target_table, target_id, request_id, outcome, error_code, detail)
              values
                (v_uid, coalesce(v_role, 'system'), 'change_password', 'profiles', v_uid, p_request_id, 'failed', sqlstate,
                 jsonb_build_object('error', sqlerrm));
              raise;
          end;
          $partial$;

          create or replace function public.finalize_student_creation(
            p_user_id uuid,
            p_username text,
            p_full_name text,
            p_teacher_id uuid,
            p_request_id uuid
          )
          returns boolean
          language plpgsql
          security definer
          set search_path = ''
          as $partial$
          begin
            return false;
          end;
          $partial$;
          SQL

              apply_convergence_migrations

              echo "Testing the missing-function state."
              docker exec "$db_container" psql \
                --username postgres --dbname postgres --no-psqlrc \
                --set ON_ERROR_STOP=1 \
                --command "drop function public.finalize_student_creation(uuid, text, text, uuid, uuid)"
              docker exec -i "$db_container" psql \
                --username postgres --dbname postgres --no-psqlrc \
                --set ON_ERROR_STOP=1 --single-transaction \
                < supabase/migrations/20260815130000_finalize_student_creation_return_status.sql

              docker exec "$db_container" psql \
                --username postgres --dbname postgres --no-psqlrc \
                --set ON_ERROR_STOP=1 --csv \
                --command "select routine.oid, pg_catalog.pg_get_userbyid(routine.proowner) as owner, language.lanname as language, routine.prorettype::pg_catalog.regtype::text as return_type, routine.prosecdef, routine.proleakproof, routine.proisstrict, routine.provolatile, routine.proparallel, routine.procost, routine.prorows, routine.proconfig, routine.proacl from pg_catalog.pg_proc as routine join pg_catalog.pg_language as language on language.oid = routine.prolang where routine.oid = pg_catalog.to_regprocedure('public.complete_password_change(uuid)')" \
                > p1-artifacts/replay/complete-password-change-metadata.after.csv
              diff -u \
                --label Replay/complete-password-change-metadata-before \
                --label Replay/complete-password-change-metadata-after \
                p1-artifacts/replay/complete-password-change-metadata.before.csv \
                p1-artifacts/replay/complete-password-change-metadata.after.csv \
                > p1-artifacts/replay/complete-password-change-metadata.diff

              docker exec "$db_container" pg_dump \
                --username postgres --dbname postgres \
                --schema-only --no-owner \
                --schema=public --schema=private \
                > p1-artifacts/replay/convergence_project_schema_with_acl.sql
              node scripts/p1/normalize-schema-dump.mjs \
                p1-artifacts/replay/replay_project_schema_with_acl.sql \
                > p1-artifacts/replay/replay_project_schema_with_acl.normalized.sql
              node scripts/p1/normalize-schema-dump.mjs \
                p1-artifacts/replay/convergence_project_schema_with_acl.sql \
                > p1-artifacts/replay/convergence_project_schema_with_acl.normalized.sql
              diff -u \
                --label Replay/before-convergence-tests \
                --label Replay/after-convergence-tests \
                p1-artifacts/replay/replay_project_schema_with_acl.normalized.sql \
                p1-artifacts/replay/convergence_project_schema_with_acl.normalized.sql \
                > p1-artifacts/replay/convergence-schema.diff
            ) > p1-artifacts/replay/convergence.log 2>&1
            convergence_status=$?
          fi

          printf '%s\n' "$convergence_status" > p1-artifacts/replay/convergence_status.txt
          echo "status=$convergence_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Replay the Production-approved-pending-exempt prefix
        id: replay_prefix
        if: always()
        shell: bash
        run: |
          # Production is allowed to lag Git by exactly the migrations
          # declared in scripts/p1/approved-pending-migrations.mjs (currently
          # none; local drafts fail closed until read-only-preflighted). The
          # comparison against Production is only
          # fair if it's made against a from-scratch replay of that same
          # prefix, not the full Git replay above -- so reset the same
          # already-running local instance again with the declared-pending
          # migration file(s) temporarily removed.
          set +e
          set -uo pipefail
          mkdir -p p1-artifacts/replay

          mapfile -t pending_migrations < <(node scripts/p1/list-approved-pending-migrations.mjs)
          if [[ "${#pending_migrations[@]}" -eq 0 ]]; then
            printf 'No approved-pending migrations declared; nothing to exclude from the prefix replay.\n' \
              | tee p1-artifacts/replay/replay-prefix.log
            prefix_status=0
          else
            moved_dir="$RUNNER_TEMP/p1-pending-migrations"
            mkdir -p "$moved_dir"
            move_failed=0
            for filename in "${pending_migrations[@]}"; do
              if [[ ! -e "supabase/migrations/$filename" ]]; then
                printf 'Approved-pending migration file missing from supabase/migrations: %s\n' "$filename" \
                  | tee -a p1-artifacts/replay/replay-prefix.log
                move_failed=1
                continue
              fi
              mv "supabase/migrations/$filename" "$moved_dir/$filename"
            done

            if [[ "$move_failed" != "0" ]]; then
              prefix_status=125
            else
              bash scripts/p1/replay-local-with-games-retirement.sh \
                2>&1 | tee -a p1-artifacts/replay/replay-prefix.log
              prefix_status=${PIPESTATUS[0]}
            fi

            for filename in "${pending_migrations[@]}"; do
              if [[ -e "$moved_dir/$filename" ]]; then
                mv "$moved_dir/$filename" "supabase/migrations/$filename"
              fi
            done
          fi

          printf '%s\n' "$prefix_status" > p1-artifacts/replay/replay_prefix_status.txt
          echo "status=$prefix_status" >> "$GITHUB_OUTPUT"

      - name: Export prefix replay schema and migration history
        id: replay_prefix_snapshot
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          snapshot_status=0
          mkdir -p p1-artifacts/replay

          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"
          if [[ -z "$db_container" ]]; then
            printf 'No running Supabase database container was found.\n' \
              | tee p1-artifacts/replay/prefix-snapshot-error.log
            : > p1-artifacts/replay/replay_prefix_schema.sql
            : > p1-artifacts/replay/replay_prefix_project_schema.sql
            : > p1-artifacts/replay/replay_prefix_project_schema_with_acl.sql
            : > p1-artifacts/replay/replay_prefix_db_migrations.csv
            snapshot_status=1
          else
            docker exec "$db_container" pg_dump \
              --username postgres --dbname postgres \
              --schema-only --no-owner --no-privileges \
              > p1-artifacts/replay/replay_prefix_schema.sql || snapshot_status=$?

            mapfile -t project_schemas < <(
              docker exec "$db_container" psql --username postgres --dbname postgres \
                --no-psqlrc --tuples-only --no-align \
                --command "select nspname from pg_namespace where nspname in ('public','private','game','game_private') order by nspname"
            )
            schema_args=()
            for schema in "${project_schemas[@]}"; do
              [[ -n "$schema" ]] && schema_args+=("--schema=$schema")
            done
            if [[ "${#schema_args[@]}" == "0" ]]; then
              printf 'No project schema exists in the prefix replay database.\n' \
                | tee -a p1-artifacts/replay/prefix-snapshot-error.log
              : > p1-artifacts/replay/replay_prefix_project_schema.sql
              snapshot_status=1
            else
              docker exec "$db_container" pg_dump \
                --username postgres --dbname postgres \
                --schema-only --no-owner --no-privileges \
                "${schema_args[@]}" \
                > p1-artifacts/replay/replay_prefix_project_schema.sql || snapshot_status=$?
              docker exec "$db_container" pg_dump \
                --username postgres --dbname postgres \
                --schema-only --no-owner \
                "${schema_args[@]}" \
                > p1-artifacts/replay/replay_prefix_project_schema_with_acl.sql || snapshot_status=$?
            fi

            history_has_name="$(
              docker exec "$db_container" psql --username postgres --dbname postgres \
                --no-psqlrc --tuples-only --no-align \
                --command "select exists (select 1 from information_schema.columns where table_schema = 'supabase_migrations' and table_name = 'schema_migrations' and column_name = 'name')"
            )"
            if [[ "$history_has_name" == "t" ]]; then
              history_name_expression="coalesce(name, '')::text"
            else
              history_name_expression="''::text"
            fi
            docker exec "$db_container" psql --username postgres --dbname postgres \
              --no-psqlrc --set ON_ERROR_STOP=1 \
              --command "copy (select row_number() over (order by version)::integer as execution_order, version::text as version, $history_name_expression as name from supabase_migrations.schema_migrations order by version) to stdout with (format csv, header true)" \
              > p1-artifacts/replay/replay_prefix_db_migrations.csv || snapshot_status=$?
          fi

          printf '%s\n' "$snapshot_status" > p1-artifacts/replay/prefix_snapshot_status.txt
          echo "status=$snapshot_status" >> "$GITHUB_OUTPUT"

      - name: Compare Git and prefix-replay migration histories
        id: replay_prefix_history
        if: always()
        shell: bash
        run: |
          # Fails closed on any bug in the exclusion logic above: this
          # proves the prefix replay's own history is exactly Git's declared
          # approved-pending set removed, nothing more or less.
          set +e
          node scripts/p1/compare-migration-history.mjs \
            docs/p1/git_migrations.csv \
            p1-artifacts/replay/replay_prefix_db_migrations.csv \
            replay-prefix \
            --allow-declared-pending \
            > p1-artifacts/replay/git-vs-replay-prefix-migrations.md 2>&1
          comparison_status=$?
          printf '%s\n' "$comparison_status" > p1-artifacts/replay/prefix_history_comparison_status.txt
          echo "status=$comparison_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop the disposable Supabase stack
        if: always()
        shell: bash
        run: |
          set +e
          supabase stop --no-backup \
            > p1-artifacts/replay/supabase-stop.log 2>&1
          stop_status=$?
          printf '%s\n' "$stop_status" \
            > p1-artifacts/replay/supabase_stop_status.txt
          exit 0

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-migration-replay-${{ github.run_id }}
          path: p1-artifacts/replay/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce zero replay failures
        if: always()
        shell: bash
        run: |
          baseline_status="${{ steps.replay.outputs.baseline_status }}"
          replay_status="${{ steps.replay.outputs.replay_status }}"
          snapshot_status="${{ steps.replay_snapshot.outputs.status }}"
          history_status="${{ steps.replay_history.outputs.status }}"
          convergence_status="${{ steps.convergence.outputs.status }}"
          prefix_status="${{ steps.replay_prefix.outputs.status }}"
          prefix_snapshot_status="${{ steps.replay_prefix_snapshot.outputs.status }}"
          prefix_history_status="${{ steps.replay_prefix_history.outputs.status }}"
          games_retirement_status="${{ steps.runtime_privileges.outputs.status }}"
          authorization_status="${{ steps.authorization_tests.outputs.status }}"
          personal_english_status="${{ steps.personal_english_tests.outputs.status }}"
          type_generation_status="${{ steps.type_generation.outputs.status }}"
          type_drift_status="${{ steps.type_drift.outputs.status }}"
          if [[ "$baseline_status" != "0" || "$replay_status" != "0" || "$snapshot_status" != "0" || "$history_status" != "0" || "$convergence_status" != "0" || "$prefix_status" != "0" || "$prefix_snapshot_status" != "0" || "$prefix_history_status" != "0" || "$games_retirement_status" != "0" || "$authorization_status" != "0" || "$personal_english_status" != "0" || "$type_generation_status" != "0" || "$type_drift_status" != "0" ]]; then
            echo "P-1 replay gate failed: baseline=$baseline_status replay=$replay_status snapshot=$snapshot_status history=$history_status convergence=$convergence_status prefix=$prefix_status prefix_snapshot=$prefix_snapshot_status prefix_history=$prefix_history_status games_retirement=$games_retirement_status authorization_pgtap=$authorization_status personal_english_pgtap=$personal_english_status type_generation=$type_generation_status type_drift=$type_drift_status"
            exit 1
          fi

  application_verification:
    name: Verify application against replay-generated types
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      SETUP_TOKEN: ci-placeholder-setup-token
    outputs:
      artifact_status: ${{ steps.install_replay_types.outputs.artifact_status }}
      type_match_status: ${{ steps.install_replay_types.outputs.type_match_status }}
      install_status: ${{ steps.npm_install.outputs.status }}
      typecheck_status: ${{ steps.typecheck.outputs.status }}
      lint_status: ${{ steps.lint.outputs.status }}
      tests_status: ${{ steps.app_tests.outputs.status }}
      build_status: ${{ steps.build.outputs.status }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download replay-generated schema types
        id: download_replay
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: p1-migration-replay-${{ github.run_id }}
          path: p1-artifacts/replay

      - name: Compare and install replay-generated schema types
        id: install_replay_types
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p p1-artifacts/application
          generated_types=p1-artifacts/replay/generated.database.types.ts
          if [[ ! -s "$generated_types" ]]; then
            echo 'Replay-generated database types artifact is absent or empty.' \
              | tee p1-artifacts/application/database-types-artifact.log
            artifact_status=1
            type_match_status=125
          else
            artifact_status=0
            sed 's/\r$//' "$generated_types" \
              > p1-artifacts/application/generated.database.types.normalized.ts
            sed 's/\r$//' supabase/database.types.ts \
              > p1-artifacts/application/committed.database.types.normalized.ts
            diff -u \
              --label committed/supabase/database.types.ts \
              --label replay/generated.database.types.ts \
              p1-artifacts/application/committed.database.types.normalized.ts \
              p1-artifacts/application/generated.database.types.normalized.ts \
              > p1-artifacts/application/database-types.diff
            type_match_status=$?
            cp "$generated_types" supabase/database.types.ts
          fi
          printf '%s\n' "$artifact_status" \
            > p1-artifacts/application/types_artifact_status.txt
          printf '%s\n' "$type_match_status" \
            > p1-artifacts/application/types_match_status.txt
          echo "artifact_status=$artifact_status" >> "$GITHUB_OUTPUT"
          echo "type_match_status=$type_match_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        id: npm_install
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p p1-artifacts/application
          npm ci 2>&1 | tee p1-artifacts/application/npm-ci.log
          install_status=${PIPESTATUS[0]}
          printf '%s\n' "$install_status" \
            > p1-artifacts/application/npm_ci_status.txt
          echo "status=$install_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Type-check application
        id: typecheck
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [[ "${{ steps.install_replay_types.outputs.artifact_status }}" != "0" || "${{ steps.npm_install.outputs.status }}" != "0" ]]; then
            echo 'SKIPPED: generated types or dependency installation unavailable.' \
              | tee p1-artifacts/application/typecheck.log
            check_status=125
          else
            npm run typecheck 2>&1 | tee p1-artifacts/application/typecheck.log
            check_status=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$check_status" \
            > p1-artifacts/application/typecheck_status.txt
          echo "status=$check_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lint application
        id: lint
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [[ "${{ steps.install_replay_types.outputs.artifact_status }}" != "0" || "${{ steps.npm_install.outputs.status }}" != "0" ]]; then
            echo 'SKIPPED: generated types or dependency installation unavailable.' \
              | tee p1-artifacts/application/lint.log
            check_status=125
          else
            npm run lint 2>&1 | tee p1-artifacts/application/lint.log
            check_status=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$check_status" \
            > p1-artifacts/application/lint_status.txt
          echo "status=$check_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run applicable non-database tests
        id: app_tests
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [[ "${{ steps.install_replay_types.outputs.artifact_status }}" != "0" || "${{ steps.npm_install.outputs.status }}" != "0" ]]; then
            echo 'SKIPPED: generated types or dependency installation unavailable.' \
              | tee p1-artifacts/application/non-database-tests.log
            check_status=125
          else
            npm run test:unit --if-present \
              2>&1 | tee p1-artifacts/application/non-database-tests.log
            check_status=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$check_status" \
            > p1-artifacts/application/non_database_tests_status.txt
          echo "status=$check_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build application
        id: build
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [[ "${{ steps.install_replay_types.outputs.artifact_status }}" != "0" || "${{ steps.npm_install.outputs.status }}" != "0" ]]; then
            echo 'SKIPPED: generated types or dependency installation unavailable.' \
              | tee p1-artifacts/application/build.log
            check_status=125
          else
            npm run build 2>&1 | tee p1-artifacts/application/build.log
            check_status=${PIPESTATUS[0]}
          fi
          printf '%s\n' "$check_status" \
            > p1-artifacts/application/build_status.txt
          echo "status=$check_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload application verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-application-verification-${{ github.run_id }}
          path: p1-artifacts/application/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce zero application verification failures
        if: always()
        shell: bash
        run: |
          artifact_status="${{ steps.install_replay_types.outputs.artifact_status }}"
          type_match_status="${{ steps.install_replay_types.outputs.type_match_status }}"
          install_status="${{ steps.npm_install.outputs.status }}"
          typecheck_status="${{ steps.typecheck.outputs.status }}"
          lint_status="${{ steps.lint.outputs.status }}"
          tests_status="${{ steps.app_tests.outputs.status }}"
          build_status="${{ steps.build.outputs.status }}"
          if [[ "$artifact_status" != "0" || "$type_match_status" != "0" || "$install_status" != "0" || "$typecheck_status" != "0" || "$lint_status" != "0" || "$tests_status" != "0" || "$build_status" != "0" ]]; then
            echo "Application verification failed: artifact=$artifact_status type_match=$type_match_status npm_ci=$install_status typecheck=$typecheck_status lint=$lint_status tests=$tests_status build=$build_status"
            exit 1
          fi

  verification_gate:
    name: P-1 replay and application aggregate gate
    needs: [replay, application_verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every replay and application status
        shell: bash
        run: |
          replay_result="${{ needs.replay.result }}"
          application_result="${{ needs.application_verification.result }}"
          baseline_status="${{ needs.replay.outputs.baseline_status }}"
          replay_status="${{ needs.replay.outputs.replay_status }}"
          games_retirement_status="${{ needs.replay.outputs.games_retirement_status }}"
          snapshot_status="${{ needs.replay.outputs.snapshot_status }}"
          history_status="${{ needs.replay.outputs.history_status }}"
          authorization_status="${{ needs.replay.outputs.authorization_test_status }}"
          personal_english_status="${{ needs.replay.outputs.personal_english_test_status }}"
          type_generation_status="${{ needs.replay.outputs.type_generation_status }}"
          type_drift_status="${{ needs.replay.outputs.type_drift_status }}"
          convergence_status="${{ needs.replay.outputs.convergence_status }}"
          prefix_status="${{ needs.replay.outputs.prefix_status }}"
          prefix_snapshot_status="${{ needs.replay.outputs.prefix_snapshot_status }}"
          prefix_history_status="${{ needs.replay.outputs.prefix_history_status }}"
          artifact_status="${{ needs.application_verification.outputs.artifact_status }}"
          app_type_match_status="${{ needs.application_verification.outputs.type_match_status }}"
          install_status="${{ needs.application_verification.outputs.install_status }}"
          typecheck_status="${{ needs.application_verification.outputs.typecheck_status }}"
          lint_status="${{ needs.application_verification.outputs.lint_status }}"
          tests_status="${{ needs.application_verification.outputs.tests_status }}"
          build_status="${{ needs.application_verification.outputs.build_status }}"

          statuses=(
            "$baseline_status" "$replay_status" "$games_retirement_status"
            "$snapshot_status" "$history_status" "$authorization_status"
            "$personal_english_status" "$type_generation_status"
            "$type_drift_status" "$convergence_status" "$prefix_status"
            "$prefix_snapshot_status" "$prefix_history_status"
            "$artifact_status" "$app_type_match_status" "$install_status"
            "$typecheck_status" "$lint_status" "$tests_status" "$build_status"
          )
          if [[ "$replay_result" != "success" || "$application_result" != "success" ]]; then
            echo "P-1 aggregate gate failed: replay job=$replay_result application job=$application_result"
            exit 1
          fi
          for status in "${statuses[@]}"; do
            if [[ "$status" != "0" ]]; then
              echo "P-1 aggregate gate failed. Replay: baseline=$baseline_status replay=$replay_status games_retirement=$games_retirement_status snapshot=$snapshot_status history=$history_status authorization=$authorization_status personal_english=$personal_english_status type_generation=$type_generation_status type_drift=$type_drift_status convergence=$convergence_status prefix=$prefix_status prefix_snapshot=$prefix_snapshot_status prefix_history=$prefix_history_status. Application: artifact=$artifact_status type_match=$app_type_match_status npm_ci=$install_status typecheck=$typecheck_status lint=$lint_status tests=$tests_status build=$build_status"
              exit 1
            fi
          done

  production_read_only_audit:
    name: Production read-only audit
    needs: [replay, verification_gate]
    if: ${{ always() && needs.verification_gate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_production_audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-read-only-audit
    env:
      PRODUCTION_DATABASE_READ_ONLY_URL: ${{ secrets.PRODUCTION_DATABASE_READ_ONLY_URL }}
      PGCONNECT_TIMEOUT: "10"
      PGOPTIONS: >-
        -c default_transaction_read_only=on
        -c statement_timeout=120000
        -c lock_timeout=5000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download replay evidence
        uses: actions/download-artifact@v4
        with:
          name: p1-migration-replay-${{ github.run_id }}
          path: p1-artifacts/replay

      - name: Require the dedicated Production read-only secret
        shell: bash
        run: |
          if [[ -z "$PRODUCTION_DATABASE_READ_ONLY_URL" ]]; then
            echo "PRODUCTION_DATABASE_READ_ONLY_URL is not configured in the production-read-only-audit environment."
            exit 1
          fi

      - name: Prove the Production connection is read-only
        shell: bash
        run: |
          docker run --rm \
            --env PGCONNECT_TIMEOUT \
            --env PGOPTIONS \
            --volume "$PWD/scripts/p1:/audit-scripts:ro" \
            postgres:17 \
            psql "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --no-psqlrc --file /audit-scripts/assert-production-read-only.sql

      - name: Assert Migration 30 precondition holds in Production
        id: migration_030_precondition
        if: always()
        shell: bash
        run: |
          if ! node scripts/p1/list-approved-pending-migrations.mjs | grep -qx '20260818021000_fix_p2p_room_code_random_source.sql'; then
            mkdir -p p1-artifacts/production
            echo 'SKIPPED: migration 30 is no longer declared pending.' > p1-artifacts/production/migration-030-precondition.log
            echo '0' > p1-artifacts/production/migration_030_precondition_status.txt
            echo 'status=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The --allow-declared-pending exemption below is only sound if
          # Production is actually still in the exact pre-migration-30 state
          # the migration was authored against. Prove that directly and
          # fail closed if it no longer holds, rather than relying solely on
          # the general schema diff to notice.
          set +e
          mkdir -p p1-artifacts/production
          docker run --rm \
            --env PGCONNECT_TIMEOUT \
            --env PGOPTIONS \
            --volume "$PWD/scripts/p1:/audit-scripts:ro" \
            postgres:17 \
            psql "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --no-psqlrc --file /audit-scripts/assert-migration-030-precondition.sql \
            > p1-artifacts/production/migration-030-precondition.log 2>&1
          precondition_status=$?
          printf '%s\n' "$precondition_status" > p1-artifacts/production/migration_030_precondition_status.txt
          echo "status=$precondition_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert Personal Word Library predecessor in Production
        id: personal_words_precondition
        if: always()
        shell: bash
        run: |
          if ! node scripts/p1/list-approved-pending-migrations.mjs | grep -qx '20260911213841_personal_words_core.sql'; then
            mkdir -p p1-artifacts/production
            echo 'SKIPPED: the Personal Word Library migration is not declared pending.' \
              > p1-artifacts/production/personal-words-phase1-precondition.log
            echo '0' \
              > p1-artifacts/production/personal_words_phase1_precondition_status.txt
            echo 'status=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          mkdir -p p1-artifacts/production
          docker run --rm \
            --env PGCONNECT_TIMEOUT \
            --env PGOPTIONS \
            --volume "$PWD/scripts/p1:/audit-scripts:ro" \
            postgres:17 \
            psql "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --no-psqlrc \
              --file /audit-scripts/assert-personal-words-phase1-precondition.sql \
            > p1-artifacts/production/personal-words-phase1-precondition.log 2>&1
          precondition_status=$?
          printf '%s\n' "$precondition_status" \
            > p1-artifacts/production/personal_words_phase1_precondition_status.txt
          echo "status=$precondition_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export Production migration history and schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p1-artifacts/production

          docker run --rm \
            --env PGCONNECT_TIMEOUT \
            --env PGOPTIONS \
            --volume "$PWD/scripts/p1:/audit-scripts:ro" \
            --volume "$PWD/p1-artifacts/production:/audit" \
            postgres:17 \
            psql "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --no-psqlrc --file /audit-scripts/export-migration-history.sql

          docker run --rm --env PGCONNECT_TIMEOUT --env PGOPTIONS postgres:17 \
            pg_dump "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --schema-only --no-owner --no-privileges \
              > p1-artifacts/production/prod_schema.sql

          mapfile -t project_schemas < <(
            docker run --rm --env PGCONNECT_TIMEOUT --env PGOPTIONS postgres:17 \
              psql "$PRODUCTION_DATABASE_READ_ONLY_URL" \
                --no-psqlrc --tuples-only --no-align \
                --command "select nspname from pg_namespace where nspname in ('public','private','game','game_private') order by nspname"
          )
          schema_args=()
          for schema in "${project_schemas[@]}"; do
            [[ -n "$schema" ]] && schema_args+=("--schema=$schema")
          done
          if [[ "${#schema_args[@]}" == "0" ]]; then
            echo "No project schema exists in Production."
            exit 1
          fi
          docker run --rm --env PGCONNECT_TIMEOUT --env PGOPTIONS postgres:17 \
            pg_dump "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --schema-only --no-owner --no-privileges \
              "${schema_args[@]}" \
              > p1-artifacts/production/prod_project_schema.sql
          docker run --rm --env PGCONNECT_TIMEOUT --env PGOPTIONS postgres:17 \
            pg_dump "$PRODUCTION_DATABASE_READ_ONLY_URL" \
              --schema-only --no-owner \
              "${schema_args[@]}" \
              > p1-artifacts/production/prod_project_schema_with_acl.sql

      - name: Compare all four P-1 evidence sets
        id: production_compare
        shell: bash
        run: |
          set +e

          # Production is only ever compared against a replay of the exact
          # prefix it's allowed to be missing (see "Replay the
          # Production-approved-pending-exempt prefix" in the replay job) --
          # never against the full Git replay, which already includes the
          # migration(s) Production has not received yet by design.
          node scripts/p1/compare-migration-history.mjs \
            docs/p1/git_migrations.csv \
            p1-artifacts/production/db_migrations.csv \
            Production \
            --allow-declared-pending \
            > p1-artifacts/production/git-vs-production-migrations.md 2>&1
          git_prod_status=$?

          # This one intentionally stays unflagged: it proves the full Git
          # replay (not the prefix) matches Git exactly, independent
          # of whatever Production currently lags behind by.
          node scripts/p1/compare-migration-history.mjs \
            docs/p1/git_migrations.csv \
            p1-artifacts/replay/replay_db_migrations.csv \
            replay \
            > p1-artifacts/production/git-vs-replay-migrations.md 2>&1
          git_replay_status=$?

          node scripts/p1/normalize-schema-dump.mjs \
            p1-artifacts/production/prod_schema.sql \
            > p1-artifacts/production/prod_schema.normalized.sql
          node scripts/p1/normalize-schema-dump.mjs \
            p1-artifacts/replay/replay_prefix_schema.sql \
            > p1-artifacts/production/replay_prefix_schema.normalized.sql
          diff -u \
            --label Production/full \
            --label Replay-prefix/full \
            p1-artifacts/production/prod_schema.normalized.sql \
            p1-artifacts/production/replay_prefix_schema.normalized.sql \
            > p1-artifacts/production/full-schema.diff
          full_schema_status=$?

          node scripts/p1/normalize-schema-dump.mjs \
            p1-artifacts/production/prod_project_schema.sql \
            > p1-artifacts/production/prod_project_schema.normalized.sql
          node scripts/p1/normalize-schema-dump.mjs \
            p1-artifacts/replay/replay_prefix_project_schema.sql \
            > p1-artifacts/production/replay_prefix_project_schema.normalized.sql
          diff -u \
            --label Production/project \
            --label Replay-prefix/project \
            p1-artifacts/production/prod_project_schema.normalized.sql \
            p1-artifacts/production/replay_prefix_project_schema.normalized.sql \
            > p1-artifacts/production/project-schema.diff
          project_schema_status=$?

          node scripts/p1/normalize-schema-dump.mjs \
            p1-artifacts/production/prod_project_schema_with_acl.sql \
            > p1-artifacts/production/prod_project_schema_with_acl.normalized.sql
          node scripts/p1/normalize-schema-dump.mjs \
            p1-artifacts/replay/replay_prefix_project_schema_with_acl.sql \
            > p1-artifacts/production/replay_prefix_project_schema_with_acl.normalized.sql
          diff -u \
            --label Production/project-with-ACL \
            --label Replay-prefix/project-with-ACL \
            p1-artifacts/production/prod_project_schema_with_acl.normalized.sql \
            p1-artifacts/production/replay_prefix_project_schema_with_acl.normalized.sql \
            > p1-artifacts/production/project-schema-with-acl.diff
          project_acl_status=$?

          # Preserve every raw diff above. The gate below uses a second,
          # fail-closed comparison that removes only exact, hash-pinned objects
          # whose intentional disposition is approved in the P-1 report.
          node scripts/p1/filter-approved-schema-drift.mjs \
            p1-artifacts/production/prod_project_schema.normalized.sql \
            > p1-artifacts/production/prod_project_schema.gated.sql \
            2> p1-artifacts/production/prod_project_schema.approved-drift.log
          prod_project_filter_status=$?
          node scripts/p1/filter-approved-schema-drift.mjs \
            p1-artifacts/production/replay_prefix_project_schema.normalized.sql \
            > p1-artifacts/production/replay_prefix_project_schema.gated.sql \
            2> p1-artifacts/production/replay_prefix_project_schema.approved-drift.log
          replay_project_filter_status=$?

          if [[ "$prod_project_filter_status" == "0" && "$replay_project_filter_status" == "0" ]]; then
            diff -u \
              --label Production/project-unresolved \
              --label Replay-prefix/project-unresolved \
              p1-artifacts/production/prod_project_schema.gated.sql \
              p1-artifacts/production/replay_prefix_project_schema.gated.sql \
              > p1-artifacts/production/unresolved-project-schema.diff
            unresolved_project_schema_status=$?
          else
            echo "Approved-drift filtering failed closed for project schema." \
              > p1-artifacts/production/unresolved-project-schema.diff
            unresolved_project_schema_status=1
          fi

          node scripts/p1/filter-approved-schema-drift.mjs \
            p1-artifacts/production/prod_project_schema_with_acl.normalized.sql \
            > p1-artifacts/production/prod_project_schema_with_acl.gated.sql \
            2> p1-artifacts/production/prod_project_schema_with_acl.approved-drift.log
          prod_project_acl_filter_status=$?
          node scripts/p1/filter-approved-schema-drift.mjs \
            p1-artifacts/production/replay_prefix_project_schema_with_acl.normalized.sql \
            > p1-artifacts/production/replay_prefix_project_schema_with_acl.gated.sql \
            2> p1-artifacts/production/replay_prefix_project_schema_with_acl.approved-drift.log
          replay_project_acl_filter_status=$?

          if [[ "$prod_project_acl_filter_status" == "0" && "$replay_project_acl_filter_status" == "0" ]]; then
            diff -u \
              --label Production/project-with-ACL-unresolved \
              --label Replay-prefix/project-with-ACL-unresolved \
              p1-artifacts/production/prod_project_schema_with_acl.gated.sql \
              p1-artifacts/production/replay_prefix_project_schema_with_acl.gated.sql \
              > p1-artifacts/production/unresolved-project-schema-with-acl.diff
            unresolved_project_acl_status=$?
          else
            echo "Approved-drift filtering failed closed for project schema with ACL." \
              > p1-artifacts/production/unresolved-project-schema-with-acl.diff
            unresolved_project_acl_status=1
          fi

          # The ACL-aware dump contains the entire application schema plus ACL
          # sections. Keep its complete diff above as evidence, but gate the ACL
          # metric only on pg_dump ACL/DEFAULT ACL object blocks so an ordinary
          # function or FK difference is not counted a second time as ACL drift.
          node scripts/p1/extract-schema-acl.mjs \
            p1-artifacts/production/prod_project_schema_with_acl.gated.sql \
            > p1-artifacts/production/prod_project_acl.gated.sql
          prod_acl_extract_status=$?
          node scripts/p1/extract-schema-acl.mjs \
            p1-artifacts/production/replay_prefix_project_schema_with_acl.gated.sql \
            > p1-artifacts/production/replay_prefix_project_acl.gated.sql
          replay_acl_extract_status=$?

          if [[ "$prod_acl_extract_status" == "0" && "$replay_acl_extract_status" == "0" ]]; then
            diff -u \
              --label Production/project-ACL-unresolved \
              --label Replay-prefix/project-ACL-unresolved \
              p1-artifacts/production/prod_project_acl.gated.sql \
              p1-artifacts/production/replay_prefix_project_acl.gated.sql \
              > p1-artifacts/production/unresolved-project-acl.diff
            unresolved_acl_status=$?
          else
            echo "ACL extraction failed closed." \
              > p1-artifacts/production/unresolved-project-acl.diff
            unresolved_acl_status=1
          fi

          {
            echo "git_vs_production_migrations=$git_prod_status"
            echo "git_vs_replay_migrations=$git_replay_status"
            echo "full_schema_raw_diff=$full_schema_status"
            echo "project_schema_raw_diff=$project_schema_status"
            echo "project_schema_with_acl_raw_diff=$project_acl_status"
            echo "unresolved_project_schema_diff=$unresolved_project_schema_status"
            echo "unresolved_project_schema_with_acl_diff=$unresolved_project_acl_status"
            echo "unresolved_acl_diff=$unresolved_acl_status"
          } | tee p1-artifacts/production/comparison-status.txt

          echo "git_prod_status=$git_prod_status" >> "$GITHUB_OUTPUT"
          echo "git_replay_status=$git_replay_status" >> "$GITHUB_OUTPUT"
          echo "full_schema_status=$full_schema_status" >> "$GITHUB_OUTPUT"
          echo "project_schema_status=$project_schema_status" >> "$GITHUB_OUTPUT"
          echo "project_acl_status=$project_acl_status" >> "$GITHUB_OUTPUT"
          echo "unresolved_project_schema_status=$unresolved_project_schema_status" >> "$GITHUB_OUTPUT"
          echo "unresolved_project_acl_status=$unresolved_project_acl_status" >> "$GITHUB_OUTPUT"
          echo "unresolved_acl_status=$unresolved_acl_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Production read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-production-read-only-audit-${{ github.run_id }}
          path: p1-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce zero unresolved drift
        if: always()
        shell: bash
        run: |
          precondition_status="${{ steps.migration_030_precondition.outputs.status }}"
          personal_words_precondition_status="${{ steps.personal_words_precondition.outputs.status }}"
          git_prod_status="${{ steps.production_compare.outputs.git_prod_status }}"
          git_replay_status="${{ steps.production_compare.outputs.git_replay_status }}"
          full_schema_status="${{ steps.production_compare.outputs.full_schema_status }}"
          project_schema_status="${{ steps.production_compare.outputs.project_schema_status }}"
          project_acl_status="${{ steps.production_compare.outputs.project_acl_status }}"
          unresolved_project_schema_status="${{ steps.production_compare.outputs.unresolved_project_schema_status }}"
          unresolved_project_acl_status="${{ steps.production_compare.outputs.unresolved_project_acl_status }}"
          unresolved_acl_status="${{ steps.production_compare.outputs.unresolved_acl_status }}"
          echo "Migration 30 precondition (evidence + gate): $precondition_status"
          echo "Personal Word Library predecessor precondition (evidence + gate): $personal_words_precondition_status"
          echo "Raw diff status (evidence only): full-schema=$full_schema_status project-schema=$project_schema_status project-ACL=$project_acl_status"
          echo "ACL-aware full application diff (evidence only): project-with-ACL=$unresolved_project_acl_status"
          if [[ "$precondition_status" != "0" || "$personal_words_precondition_status" != "0" || "$git_prod_status" != "0" || "$git_replay_status" != "0" || "$unresolved_project_schema_status" != "0" || "$unresolved_acl_status" != "0" ]]; then
            echo "P-1 unresolved drift gate failed: migration-030-precondition=$precondition_status personal-words-precondition=$personal_words_precondition_status git/prod=$git_prod_status git/replay=$git_replay_status project-schema=$unresolved_project_schema_status ACL=$unresolved_acl_status"
            exit 1
          fi
